name: R04.17 Float Real Rescale Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: R04.17 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version
          uname -a

      - name: Probe 1-3
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC"             -Isource -i             research/r04-17-float-real-rescale/probe_1_3.d             -of=/tmp/r04-17/probe_1_3
          /tmp/r04-17/probe_1_3


      - name: Probe 4 exact binary32 oracle
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" -Isource -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_4_runner.d \
            research/r04-17-float-real-rescale/binary32_kernel.d \
            -of=/tmp/r04-17/probe_4

          python3 \
            research/r04-17-float-real-rescale/probe_4_oracle.py \
            /tmp/r04-17/probe_4 \
            /tmp/r04-17/cases.txt


      - name: Probe 5 IEEE special values
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" -Isource -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_5_ieee.d \
            research/r04-17-float-real-rescale/binary32_kernel.d \
            -of=/tmp/r04-17/probe_5
          /tmp/r04-17/probe_5

      - name: Probe 6 native CTFE positive
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" \
            research/r04-17-float-real-rescale/probe_6_positive.d \
            -of=/tmp/r04-17/probe_6_positive
          /tmp/r04-17/probe_6_positive

      - name: Probe 6 represented-source CTFE negatives
        shell: bash
        run: |
          mkdir -p /tmp/r04-17

          if "$DC" -Isource -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_6_negative_product.d \
            research/r04-17-float-real-rescale/binary32_kernel.d \
            -of=/tmp/r04-17/negative_product \
            > /tmp/r04-17/product.log 2>&1
          then
            echo "ERROR: product CTFE negative unexpectedly compiled"
            exit 1
          fi

          grep -F \
            "R04.17: nontrivial binary32 product rescale requires represented-source runtime semantics" \
            /tmp/r04-17/product.log

          if "$DC" -Isource -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_6_negative_quotient.d \
            research/r04-17-float-real-rescale/binary32_kernel.d \
            -of=/tmp/r04-17/negative_quotient \
            > /tmp/r04-17/quotient.log 2>&1
          then
            echo "ERROR: quotient CTFE negative unexpectedly compiled"
            exit 1
          fi

          grep -F \
            "R04.17: nontrivial binary32 quotient rescale requires represented-source runtime semantics" \
            /tmp/r04-17/quotient.log

          echo "R04.17 Probe 6 represented-source CTFE negatives PASS"


      - name: Probe 7 layout-free real decomposition
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" \
            research/r04-17-float-real-rescale/probe_7_real_decompose.d \
            -of=/tmp/r04-17/probe_7
          /tmp/r04-17/probe_7


      - name: Repository unit tests with binary32 integration
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Repository compile-negative tests with binary32 integration
        shell: bash
        run: bash tests/negative/run.sh "$DC"

      - name: External consumer with binary32 integration
        shell: bash
        run: |
          cd tests/consumer
          dub run --compiler="$DC" --force

      - name: Release build with binary32 integration
        shell: bash
        run: dub build --build=release --compiler="$DC" --force


      - name: Probe 8 binary32 performance
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" -O -release -inline -boundscheck=off \
                -Isource -i \
                research/r04-17-float-real-rescale/probe_8_performance.d \
                -of=/tmp/r04-17/probe_8_perf
              ;;
            ldc-*)
              "$DC" -O3 -release -boundscheck=off \
                -Isource -i \
                research/r04-17-float-real-rescale/probe_8_performance.d \
                -of=/tmp/r04-17/probe_8_perf
              ;;
          esac
          /tmp/r04-17/probe_8_perf

      - name: Probe 8 binary32 codegen
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" -O -release -inline -boundscheck=off \
                -Isource -i -c \
                research/r04-17-float-real-rescale/probe_8_codegen.d \
                -of=/tmp/r04-17/probe_8_codegen.o
              ;;
            ldc-*)
              "$DC" -O3 -release -boundscheck=off \
                -Isource -i -c \
                research/r04-17-float-real-rescale/probe_8_codegen.d \
                -of=/tmp/r04-17/probe_8_codegen.o
              ;;
          esac

          for sym in direct_product quantity_product direct_quotient quantity_quotient
          do
            echo "=== $sym ==="
            objdump -d --no-show-raw-insn /tmp/r04-17/probe_8_codegen.o |
              sed -n "/<$sym>:/,/^$/p"
          done


      - name: Probe 9 trait-driven real80 exact oracle
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" \
            -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_9_real_runner.d \
            research/r04-17-float-real-rescale/real80_kernel.d \
            -of=/tmp/r04-17/probe_9

          python3 \
            research/r04-17-float-real-rescale/probe_9_real_oracle.py \
            /tmp/r04-17/probe_9 \
            /tmp/r04-17/real_cases.txt


      - name: Probe 10 trait kernel against binary64 reference
        shell: bash
        run: |
          mkdir -p /tmp/r04-17
          "$DC" \
            -Isource -i \
            -Iresearch/r04-17-float-real-rescale \
            research/r04-17-float-real-rescale/probe_10_trait_double.d \
            research/r04-17-float-real-rescale/real80_kernel.d \
            -of=/tmp/r04-17/probe_10
          /tmp/r04-17/probe_10
