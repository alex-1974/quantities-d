name: R15 Exact Unit Rescale Research
on:
  push:
    branches: [research/r15-exact-unit-rescale]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Versions
        run: |
          "$DC" --version
          python3 --version
      - name: Probe 10 exact scale and direct TargetRep
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale research/r15-exact-unit-rescale/runner.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-10
          python3 research/r15-exact-unit-rescale/oracle.py /tmp/r15-probe-10
      - name: Probe 11 exact composed Unit scales
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale research/r15-composed-unit-rescale/runner.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-11
          python3 research/r15-composed-unit-rescale/oracle.py /tmp/r15-probe-11
      - name: Probe 12 explicit integral rounding
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale research/r15-floating-integral/runner.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-12
          python3 research/r15-floating-integral/oracle.py /tmp/r15-probe-12
      - name: Probe 13 represented floating source to integral
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral research/r15-floating-source-integral/runner.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-13
          python3 research/r15-floating-source-integral/oracle.py /tmp/r15-probe-13
      - name: Probe 14 actual Unit API and result invariants in debug and release
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then
              sources+=("$source")
            fi
          done
          for build in debug release; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            "$DC" "${flags[@]}" -Isource research/r15-mixed-api/carrier-observation.d source/quantities/*.d -of=/tmp/r15-carrier-observe
            /tmp/r15-carrier-observe
            "$DC" "${flags[@]}" -Iresearch/r15-mixed-api -Isource -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral research/r15-mixed-api/runner.d research/r15-mixed-api/consumer.d research/r15-mixed-api/quantities/conversion.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d "${sources[@]}" -of=/tmp/r15-probe-14
            echo "Probe 14 $build"
            python3 research/r15-mixed-api/oracle.py /tmp/r15-probe-14
          done
      - name: Probe 15 direct floating targets and integral API regression
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-floating-target-api -Isource -Iresearch/r15-mixed-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-floating-target-api/quantities/conversion.d research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d research/r15-mixed-api/consumer.d)
          for build in debug release; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-floating-target-api/consumer.d research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-15
            echo "Probe 15 $build"
            python3 research/r15-floating-target-api/oracle.py /tmp/r15-probe-15
            "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-14-under-15
            python3 research/r15-mixed-api/oracle.py /tmp/r15-probe-14-under-15
          done
