name: R15 Exact Unit Rescale Research
on:
  push:
    branches: [research/r15-exact-unit-rescale]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Versions
        run: |
          "$DC" --version
          python3 --version
      - name: Probe 10 exact scale and direct TargetRep
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale research/r15-exact-unit-rescale/runner.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-10
          python3 research/r15-exact-unit-rescale/oracle.py /tmp/r15-probe-10
      - name: Probe 11 exact composed Unit scales
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale research/r15-composed-unit-rescale/runner.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-11
          python3 research/r15-composed-unit-rescale/oracle.py /tmp/r15-probe-11
      - name: Probe 12 explicit integral rounding
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale research/r15-floating-integral/runner.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-12
          python3 research/r15-floating-integral/oracle.py /tmp/r15-probe-12
      - name: Probe 13 represented floating source to integral
        run: |
          "$DC" -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral research/r15-floating-source-integral/runner.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d -of=/tmp/r15-probe-13
          python3 research/r15-floating-source-integral/oracle.py /tmp/r15-probe-13
      - name: Probe 14 actual Unit API and result invariants in debug and release
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then
              sources+=("$source")
            fi
          done
          for build in debug release; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            "$DC" "${flags[@]}" -Isource research/r15-mixed-api/carrier-observation.d source/quantities/*.d -of=/tmp/r15-carrier-observe
            /tmp/r15-carrier-observe
            "$DC" "${flags[@]}" -Iresearch/r15-mixed-api -Isource -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral research/r15-mixed-api/runner.d research/r15-mixed-api/consumer.d research/r15-mixed-api/quantities/conversion.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d "${sources[@]}" -of=/tmp/r15-probe-14
            echo "Probe 14 $build"
            python3 research/r15-mixed-api/oracle.py /tmp/r15-probe-14
          done
      - name: Probe 15 direct floating targets and integral API regression
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-floating-target-api -Isource -Iresearch/r15-mixed-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-floating-target-api/quantities/conversion.d research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d research/r15-mixed-api/consumer.d)
          for build in debug release; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-floating-target-api/consumer.d research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-15
            echo "Probe 15 $build"
            python3 research/r15-floating-target-api/oracle.py /tmp/r15-probe-15
            "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-14-under-15
            python3 research/r15-mixed-api/oracle.py /tmp/r15-probe-14-under-15
          done
      - name: Probe 16 selected API request and range-rounding contract
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-api-contract -Isource -Iresearch/r15-floating-target-api -Iresearch/r15-mixed-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d)
          consumers=(research/r15-mixed-api/consumer.d research/r15-floating-target-api/consumer.d)
          "$DC" -Iresearch/r15-floating-target-api -Isource -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral research/r15-api-contract/source-override-observation.d research/r15-floating-target-api/quantities/conversion.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-source-override-observation
          /tmp/r15-source-override-observation
          python3 research/r15-api-contract/witnesses.py
          for build in debug release; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            echo "Probe 16 $build"
            "$DC" "${flags[@]}" "${common[@]}" research/r15-api-contract/consumer.d research/r15-api-contract/quantities/conversion.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-16
            /tmp/r15-probe-16
            "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-api-contract/quantities/conversion.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-15-under-16
            python3 research/r15-floating-target-api/oracle.py /tmp/r15-probe-15-under-16
            "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d research/r15-api-contract/quantities/conversion.d "${consumers[@]}" research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-14-under-16
            python3 research/r15-mixed-api/oracle.py /tmp/r15-probe-14-under-16
          done
      - name: Probe 17 equivalent-semantics API and compiler cost (bounds on)
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-api-contract -Isource -Iresearch/r15-floating-target-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-api-contract/quantities/conversion.d research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d)
          case "$DC" in
            *ldc2) flags=(-release -O3 -boundscheck=on) ;;
            *) flags=(-release -O -inline -boundscheck=on) ;;
          esac
          echo "COST_FLAGS $DC ${flags[*]}"
          lscpu | head -20
          "$DC" "${flags[@]}" "${common[@]}" research/r15-api-cost/benchmark.d research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-probe-17
          /tmp/r15-probe-17
          consumers=(research/r15-mixed-api/consumer.d research/r15-floating-target-api/consumer.d)
          "$DC" "${flags[@]}" "${common[@]}" research/r15-api-contract/consumer.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-contract-optimized
          /tmp/r15-contract-optimized
          "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-floating-optimized
          python3 research/r15-floating-target-api/oracle.py /tmp/r15-floating-optimized
          "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-integral-optimized
          python3 research/r15-mixed-api/oracle.py /tmp/r15-integral-optimized
          for round in 1 2 3; do
            for kind in baseline consumer; do
              /usr/bin/time -f "BUILD_COST,$round,$kind,%e,%M" -o /tmp/r15-build-time "$DC" "${flags[@]}" "${common[@]}" "research/r15-api-cost/build-$kind.d" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-build-$kind
              cat /tmp/r15-build-time
              /tmp/r15-build-$kind
            done
          done
      - name: Probe 18 identity inclusion fast paths, oracle and codegen
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-identity-fast-path -Isource -Iresearch/r15-floating-target-api -Iresearch/r15-mixed-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-identity-fast-path/quantities/conversion.d research/r15-identity-fast-path/kernel.d research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d)
          consumers=(research/r15-mixed-api/consumer.d research/r15-floating-target-api/consumer.d)
          case "$DC" in
            *ldc2) optimized=(-release -O3 -boundscheck=on) ;;
            *) optimized=(-release -O -inline -boundscheck=on) ;;
          esac
          for build in debug release optimized; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            if [[ "$build" == optimized ]]; then flags=("${optimized[@]}"); fi
            echo "Probe 18 $build"
            "$DC" "${flags[@]}" "${common[@]}" research/r15-identity-fast-path/runner.d research/r15-identity-fast-path/consumer.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-oracle
            python3 research/r15-identity-fast-path/oracle.py /tmp/r15-identity-oracle
            "$DC" "${flags[@]}" "${common[@]}" research/r15-api-contract/consumer.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-contract
            /tmp/r15-identity-contract
            "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-floating-under-18
            python3 research/r15-floating-target-api/oracle.py /tmp/r15-floating-under-18
            "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-integral-under-18
            python3 research/r15-mixed-api/oracle.py /tmp/r15-integral-under-18
          done
          echo "IDENTITY_COST_FLAGS $DC ${optimized[*]}"
          "$DC" "${optimized[@]}" "${common[@]}" research/r15-identity-fast-path/benchmark.d research/r15-identity-fast-path/codegen.d research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-cost
          /tmp/r15-identity-cost
          python3 research/r15-identity-fast-path/codegen.py /tmp/r15-identity-cost
          for round in 1 2 3; do
            for kind in baseline consumer; do
              /usr/bin/time -f "IDENTITY_BUILD_COST,$round,$kind,%e,%M" -o /tmp/r15-identity-build-time "$DC" "${optimized[@]}" "${common[@]}" "research/r15-api-cost/build-$kind.d" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-build-$kind
              cat /tmp/r15-identity-build-time
              /tmp/r15-identity-build-$kind
            done
          done
      - name: Probe 19 floating to long identity, exact bounds and rounding
        shell: bash
        run: |
          sources=()
          for source in source/quantities/*.d; do
            if [[ "$source" != source/quantities/conversion.d ]]; then sources+=("$source"); fi
          done
          common=(-Iresearch/r15-integral-identity-fast-path -Iresearch/r15-identity-fast-path -Isource -Iresearch/r15-floating-target-api -Iresearch/r15-mixed-api -Iresearch/r15-exact-unit-rescale -Iresearch/r15-composed-unit-rescale -Iresearch/r15-floating-source-integral)
          kernels=(research/r15-integral-identity-fast-path/quantities/conversion.d research/r15-integral-identity-fast-path/kernel.d research/r15-identity-fast-path/kernel.d research/r15-floating-target-api/kernel.d research/r15-floating-source-integral/kernel.d research/r15-composed-unit-rescale/kernel.d research/r15-exact-unit-rescale/kernel.d)
          consumers=(research/r15-mixed-api/consumer.d research/r15-floating-target-api/consumer.d)
          case "$DC" in
            *ldc2) optimized=(-release -O3 -boundscheck=on) ;;
            *) optimized=(-release -O -inline -boundscheck=on) ;;
          esac
          for build in debug release optimized; do
            flags=()
            if [[ "$build" == release ]]; then flags+=(-release); fi
            if [[ "$build" == optimized ]]; then flags=("${optimized[@]}"); fi
            echo "Probe 19 $build"
            "$DC" "${flags[@]}" "${common[@]}" research/r15-identity-fast-path/runner.d research/r15-identity-fast-path/consumer.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-floating-identity-under-19
            python3 research/r15-identity-fast-path/oracle.py /tmp/r15-floating-identity-under-19
            "$DC" "${flags[@]}" "${common[@]}" research/r15-integral-identity-fast-path/runner.d research/r15-integral-identity-fast-path/consumer.d research/r15-mixed-api/consumer.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-oracle
            python3 research/r15-integral-identity-fast-path/oracle.py /tmp/r15-identity-oracle
            "$DC" "${flags[@]}" "${common[@]}" research/r15-api-contract/consumer.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-contract
            /tmp/r15-identity-contract
            "$DC" "${flags[@]}" "${common[@]}" research/r15-floating-target-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-floating-under-18
            python3 research/r15-floating-target-api/oracle.py /tmp/r15-floating-under-18
            "$DC" "${flags[@]}" "${common[@]}" research/r15-mixed-api/runner.d research/r15-floating-target-api/fixtures.d "${consumers[@]}" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-integral-under-18
            python3 research/r15-mixed-api/oracle.py /tmp/r15-integral-under-18
          done
          echo "INTEGRAL_IDENTITY_COST_FLAGS $DC ${optimized[*]}"
          "$DC" "${optimized[@]}" "${common[@]}" research/r15-integral-identity-fast-path/benchmark.d research/r15-integral-identity-fast-path/codegen.d research/r15-floating-target-api/fixtures.d "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-cost
          /tmp/r15-identity-cost
          python3 research/r15-integral-identity-fast-path/codegen.py /tmp/r15-identity-cost "$(/tmp/r15-identity-oracle --traits | cut -d' ' -f1)"
          for round in 1 2 3; do
            for kind in baseline consumer; do
              /usr/bin/time -f "INTEGRAL_IDENTITY_BUILD_COST,$round,$kind,%e,%M" -o /tmp/r15-identity-build-time "$DC" "${optimized[@]}" "${common[@]}" "research/r15-api-cost/build-$kind.d" "${kernels[@]}" "${sources[@]}" -of=/tmp/r15-identity-build-$kind
              cat /tmp/r15-identity-build-time
              /tmp/r15-identity-build-$kind
            done
          done
