name: R15 Explicit Target Rep Research

on:
  push:
    branches:
      - research/r15-explicit-target-rep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: R15 explicit target / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - uses: actions/checkout@v7

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Versions
        shell: bash
        run: |
          "$DC" --version
          dub --version

      - name: Probe 3 explicit target/source capture
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC" -Isource -i \
            research/r15-explicit-target-rep/probe_3_explicit_target_rep.d \
            -of=/tmp/r15/probe_3
          /tmp/r15/probe_3

      - name: Probe 4 representation pair matrix
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC" \
            research/r15-explicit-target-rep/probe_4_pair_matrix.d \
            -of=/tmp/r15/probe_4
          /tmp/r15/probe_4


      - name: Probe 5 identity-scale mixed-Rep oracle
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC"             -Iresearch/r15-explicit-target-rep             research/r15-explicit-target-rep/probe_5_runner.d             research/r15-explicit-target-rep/identity_conversion_kernel.d             -of=/tmp/r15/probe_5

          python3             research/r15-explicit-target-rep/probe_5_oracle.py             /tmp/r15/probe_5


      - name: Probe 6 current-real identity-scale oracle
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC"             -Iresearch/r15-explicit-target-rep             research/r15-explicit-target-rep/probe_6_runner.d             research/r15-explicit-target-rep/real_identity_conversion.d             -of=/tmp/r15/probe_6

          python3             research/r15-explicit-target-rep/probe_6_oracle.py             /tmp/r15/probe_6


      - name: Probe 7 direct TargetRep rounding requirement
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC" -Isource -i             research/r15-explicit-target-rep/probe_7_target_direct_rounding.d             -of=/tmp/r15/probe_7
          /tmp/r15/probe_7


      - name: Probe 8 mathematical overflow boundary
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC" -Isource -i             research/r15-explicit-target-rep/probe_8_overflow_boundary.d             -of=/tmp/r15/probe_8
          /tmp/r15/probe_8
