name: R15 Mixed Rep Conversion Research

on:
  push:
    branches:
      - research/r15-mixed-rep-conversion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: R15 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Probe 1 current surface matrix
        shell: bash
        run: |
          mkdir -p /tmp/r15
          "$DC" -Isource -i \
            research/r15-mixed-rep-conversion/probe_1_surface_matrix.d \
            -of=/tmp/r15/probe_1
          /tmp/r15/probe_1
