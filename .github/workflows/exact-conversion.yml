name: Exact conversion qualification

on:
  pull_request:
    branches: [develop]
    paths:
      - source/quantities/**
      - tests/exact-conversion/**
      - tests/conversion-as/**
      - tests/consumer/**
      - .github/workflows/exact-conversion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned independent research oracles
        uses: actions/checkout@v7
        with:
          ref: c4e752d9d47acb962cbd77f302198c9e0ea34551
          path: oracle-reference
          sparse-checkout: |
            research/r15-exact-unit-rescale
            research/r15-composed-unit-rescale
            research/r15-floating-integral
            research/r15-floating-source-integral
            research/r15-mixed-api
            research/r15-floating-target-api
            research/r15-integral-source-api
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Qualify production kernel against Fraction oracles
        shell: bash
        run: bash tests/exact-conversion/run.sh "$DC" oracle-reference/research
      - name: Qualify public APIs against pinned Fraction oracles
        shell: bash
        run: bash tests/conversion-as/run.sh "$DC" oracle-reference/research
